version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Major upgrades are reviewed as dedicated migrations with their own
    # compatibility and rollout testing instead of automated version bumps.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      # React runtime and type packages must advance together. React rejects
      # mixed react/react-dom versions at runtime, and the type packages share
      # the same minor-version compatibility boundary.
      react-stack:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      routine-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - stripe
          # React upgrades receive a dedicated bundle and compatibility review.
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
