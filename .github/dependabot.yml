version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Major upgrades are reviewed as dedicated migrations with their own
    # compatibility and rollout testing instead of automated version bumps.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      routine-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - stripe
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
