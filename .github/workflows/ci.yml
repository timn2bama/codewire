name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.19.1

      - name: Check deployable API boundary
        run: npm run check:api-boundary

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Test critical browser journeys
        run: npm run test:e2e

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Select isolated Supabase ports
        shell: bash
        run: |
          set -euo pipefail
          read -r db_port shadow_port < <(
            python3 - <<'PY'
          import socket

          sockets = []
          ports = []
          for _ in range(2):
              sock = socket.socket()
              sock.bind(("127.0.0.1", 0))
              sockets.append(sock)
              ports.append(sock.getsockname()[1])
          print(*ports)
          for sock in sockets:
              sock.close()
          PY
          )
          sed -i "0,/port = 54322/s//port = ${db_port}/" supabase/config.toml
          sed -i "0,/shadow_port = 54320/s//shadow_port = ${shadow_port}/" supabase/config.toml
          echo "CODEWIRE_LOCAL_DB_PORT=${db_port}" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:${db_port}/postgres" >> "$GITHUB_ENV"
          echo "Selected Supabase database ports: db=${db_port}, shadow=${shadow_port}"

      - name: Clean stale local Supabase resources
        shell: bash
        run: |
          supabase stop --no-backup || true
          docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}'
          ss -ltnp || true

      # pgTAP only needs Postgres; exclude every optional local service.
      - name: Start local Supabase database
        id: supabase_start
        run: >-
          supabase start --exclude
          gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Replay local database migrations
        run: supabase db reset --local --no-seed

      - name: Test local database
        run: supabase test db --local

      - name: Test Checkout concurrency
        run: npm run test:db:concurrency

      - name: Stop local Supabase
        if: ${{ always() && steps.supabase_start.outcome != 'skipped' }}
        run: supabase stop --no-backup
